name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # installs elan and the toolchain from lean-toolchain, fetches the Mathlib cache, runs `lake build`
      - uses: leanprover/lean-action@v1
      - name: Check axioms
        run: lake env lean Verify.lean
